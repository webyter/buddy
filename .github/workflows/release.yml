name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the built artifacts to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
      - name: Smoke-test the wheel in a clean venv
        run: |
          python3 -m venv /tmp/buddy-venv
          /tmp/buddy-venv/bin/pip install dist/*.whl
          /tmp/buddy-venv/bin/buddy --help | head -3
      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
